{# Tema antes de pintar, para que no parpadee. Preferencia por dispositivo: auto, claro u oscuro. #}
<meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ebdfc8" media="(prefers-color-scheme: light)">
<script>
  (function () {
    var pref = 'auto';
    try { pref = localStorage.getItem('tema') || 'auto'; } catch (e) {}
    var oscuro = pref === 'oscuro' || (pref !== 'claro' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
    var raiz = document.documentElement;
    raiz.dataset.theme = oscuro ? 'dark' : 'light';
    raiz.setAttribute('data-bs-theme', oscuro ? 'dark' : 'light');
  })();
</script>
