{# El elemento #tarea-{pk} se borra con hx-swap="delete". Este OOB lo suma a "Hechas" en el Resumen. #}
<div hx-swap-oob="afterbegin:#tareas-done">
<div id="tarea-done-{{ tarea.pk }}" class="fila cd-tarea cd-tarea--hecha">
  <span class="ck cd-ck--hecha" aria-hidden="true">✓</span>
  <span class="fila__texto">
    <span class="cd-tarea__titulo">{{ tarea.titulo }}</span>
    <span class="mo cd-reg__meta">{% if tarea.completada_en %}{{ tarea.completada_en|date:"d/m" }} · {% endif %}{{ tarea.get_categoria_display|lower }}</span>
  </span>
  {% if can_edit_cultivo %}
  <button type="button" class="pill cd-reabrir" hx-post="{% url 'growlog:tarea_descompletar' tarea.pk %}"
          hx-target="#tarea-done-{{ tarea.pk }}" hx-swap="delete">Reabrir</button>
  {% endif %}
</div>
</div>
