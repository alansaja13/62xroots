<div id="tarea-{{ tarea.pk }}" class="cd-tarea cd-tarea--{{ tarea.prioridad }}{% if tarea.completada %} opacity-50{% endif %}">
  <div style="display: flex; gap: 10px; align-items: flex-start; flex: 1; min-width: 0;">
    {% if not tarea.completada %}
    <button
      class="border-0 p-0"
      style="background: transparent; cursor: pointer; width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0;"
      hx-post="{% url 'growlog:tarea_completar' tarea.pk %}"
      hx-target="#tarea-{{ tarea.pk }}"
      hx-swap="outerHTML"
      title="Completar">
      <span style="display: inline-block; width: 16px; height: 16px; border: 1.5px solid var(--fine); transition: border-color .12s, background .12s;"></span>
    </button>
    {% else %}
    <span style="display: inline-flex; align-items: center; justify-content: center;
                 width: 16px; height: 16px; background: var(--green); color: var(--bg);
                 margin-top: 2px; flex-shrink: 0; font-size: 11px; font-weight: 800;">✓</span>
    {% endif %}

    <div style="flex: 1; min-width: 0;">
      <div class="cd-tarea__title{% if tarea.completada %} text-decoration-line-through c-fine{% endif %}">
        {{ tarea.titulo }}
      </div>
      <div class="cd-tarea__meta{% if tarea.prioridad == 'urgente' and not tarea.completada %} cd-tarea__meta--urg{% endif %}">
        {% if tarea.fecha_objetivo %}
          <span>{{ tarea.fecha_objetivo|date:"d/m" }}</span>
          <span class="c-fine">·</span>
        {% endif %}
        <span class="c-fine">{{ tarea.get_categoria_display }}</span>
        {% if tarea.prioridad == 'urgente' and not tarea.completada %}
          <span class="c-fine">·</span>
          <span>● urgente</span>
        {% endif %}
      </div>
    </div>
  </div>

  <a href="{% url 'growlog:tarea_editar' tarea.pk %}"
     style="color: var(--fine); font-size: 11px; text-decoration: none; padding: 4px;" title="Editar">
    <i class="bi bi-pencil"></i>
  </a>
</div>
