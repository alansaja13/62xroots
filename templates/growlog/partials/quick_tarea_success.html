<div class="alert alert-success alert-dismissible fade show" role="alert"
     style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
  <span style="display: inline-flex; align-items: center; justify-content: center;
               width: 22px; height: 22px; background: var(--plum); color: var(--bg);
               font-weight: 800; font-size: 12px;">✓</span>
  <span class="mono" style="font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--plum);">
    tarea creada
  </span>
  <span class="c-cream mono" style="font-size: 13px;">{{ tarea.titulo }}</span>
  <span class="c-fine">·</span>
  <span class="pill pill--{% if tarea.prioridad == 'urgente' %}rust{% elif tarea.prioridad == 'normal' %}cream{% else %}cream{% endif %}">
    {{ tarea.get_prioridad_display }}
  </span>
  <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
