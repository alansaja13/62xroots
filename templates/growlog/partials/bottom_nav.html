{# Barra fija del celular: Hoy · Cultivo · [+] · Plantas · Más. Tareas y las demás secciones del cultivo cuelgan de "Más" y de las secciones del cultivo. #}
{% with c=cultivo_destino %}
<a href="{% url 'growlog:dashboard' %}" class="barra__item{% if nav_activa == 'hoy' %} on{% endif %}"{% if nav_activa == 'hoy' %} aria-current="page"{% endif %}>Hoy</a>
<a href="{% if c %}{% url 'growlog:cultivo_detail' c.slug %}{% else %}{% url 'growlog:nuevo_cultivo' %}{% endif %}" class="barra__item{% if nav_activa == 'cultivo' or nav_activa == 'tareas' %} on{% endif %}">Cultivo</a>
<a href="{% url 'growlog:registrar' %}{% if cultivo_nav and can_edit_cultivo %}?cultivo={{ cultivo_nav.pk }}{% endif %}" class="barra__mas" {% if request.resolver_match.url_name != 'registrar' %}hx-get="{% url 'growlog:registrar' %}?hoja=1{% if cultivo_nav and can_edit_cultivo %}&cultivo={{ cultivo_nav.pk }}{% endif %}" hx-target="#hoja"{% endif %} aria-label="Registrar">+</a>
<a href="{% if c %}{% url 'growlog:cultivo_detail' c.slug %}#plantas{% else %}{% url 'growlog:nuevo_cultivo' %}{% endif %}" class="barra__item{% if nav_activa == 'plantas' %} on{% endif %}">Plantas</a>
<a href="{% url 'growlog:mas' %}" class="barra__item{% if nav_activa == 'mas' %} on{% endif %}"{% if nav_activa == 'mas' %} aria-current="page"{% endif %}>Más</a>
{% endwith %}
