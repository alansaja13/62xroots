{# Encabezado de las pantallas de un cultivo: selector y secciones a un toque (con scroll lateral en el celular). #}
<div class="cultivo-head">
  {% include "growlog/partials/cultivo_selector.html" %}
  <nav class="cultivo-tabs" aria-label="Secciones de {{ cultivo_nav.nombre }}">
    {% for p in pestanas_cultivo %}
    <a href="{{ p.url }}" class="cultivo-tabs__item{% if p.activa %} active{% endif %}"{% if p.activa %} aria-current="page"{% endif %}>{{ p.etiqueta }}</a>
    {% endfor %}
  </nav>
</div>
