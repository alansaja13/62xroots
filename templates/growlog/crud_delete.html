{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block extra_head %}
<style>
.del-wrap {
  max-width:460px;margin:4rem auto;text-align:center;
}
.del-icon {
  font-size:3rem;color:var(--c-danger);opacity:.7;margin-bottom:1.25rem;
}
.del-title {
  font-size:1.4rem;font-weight:900;letter-spacing:-.025em;margin-bottom:.5rem;
}
.del-name {
  font-size:.9rem;color:var(--c-muted);font-family:ui-monospace,monospace;
  padding:.3rem .8rem;border:1px solid var(--c-border);border-radius:4px;
  display:inline-block;margin-bottom:1.5rem;
}
.del-warn {
  font-size:.8rem;color:var(--c-muted);margin-bottom:2rem;
}
</style>
{% endblock %}

{% block content %}
<div class="del-wrap">
  <div class="del-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
  <h1 class="del-title">{{ title }}</h1>
  <div class="del-name">{{ object_name }}</div>
  <p class="del-warn">Esta acción no se puede deshacer.</p>

  <div class="d-flex gap-3 justify-content-center">
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn" style="background:var(--c-danger);color:#fff;font-weight:700;padding:.65rem 1.6rem">
        <i class="bi bi-trash3 me-1"></i> Confirmar eliminación
      </button>
    </form>
    <a href="{{ back_url }}" class="btn btn-outline-secondary" style="padding:.65rem 1.2rem">
      Cancelar
    </a>
  </div>
</div>
{% endblock %}
