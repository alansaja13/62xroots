{% load static %}
<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — 62xroots</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@300..700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #16110b;
      --bg-alt: #1d1610;
      --card: #221c14;
      --card-alt: #2a2218;
      --rule: #3a2f1f;
      --rule-soft: #28201a;
      --cream: #f3e9d1;
      --cream-soft: #bfb091;
      --fine: #7a6c52;
      --green: #b1d160;
      --green-deep: #5a7929;
      --green-wash: rgba(177, 209, 96, .08);
      --rust: #d96a3d;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at 0% 0%, rgba(177, 209, 96, .04) 0, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(217, 106, 61, .03) 0, transparent 35%),
        var(--bg);
      color: var(--cream);
      font-family: "Geist", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .login-watermark {
      position: absolute;
      right: -120px;
      top: -80px;
      width: 620px;
      height: 620px;
      opacity: .07;
      pointer-events: none;
    }

    .login-brand {
      position: absolute;
      top: 28px;
      left: 40px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .login-brand img {
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 0 8px rgba(177, 209, 96, .4));
    }

    .login-brand__name {
      font-family: "Bricolage Grotesque", sans-serif;
      font-variation-settings: "wdth" 85, "opsz" 96;
      font-size: 20px;
      font-weight: 700;
      color: var(--cream);
      line-height: 1;
      letter-spacing: .02em;
    }

    .login-brand__sub {
      font-family: "Geist Mono", monospace;
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--fine);
      display: block;
      margin-top: 4px;
    }

    .login-banner {
      position: absolute;
      bottom: 24px;
      left: 40px;
      right: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Geist Mono", monospace;
      font-size: 10px;
      color: var(--fine);
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    .login-eyebrow {
      font-family: "Geist Mono", monospace;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--fine);
      margin-bottom: 8px;
    }

    .login-title {
      font-family: "Bricolage Grotesque", sans-serif;
      font-variation-settings: "wdth" 85, "opsz" 96;
      font-size: 68px;
      font-weight: 800;
      letter-spacing: -.022em;
      line-height: .92;
      display: block;
      margin: 0;
      color: var(--cream);
    }

    .login-title--accent {
      color: var(--green);
      font-style: italic;
      font-size: large;
    }

    .login-subtitle {
      font-family: "Geist Mono", monospace;
      font-size: 12px;
      color: var(--cream-soft);
      margin-top: 18px;
    }

    .login-fields {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    label {
      font-family: "Geist Mono", monospace;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--fine);
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    input[type=text],
    input[type=password] {
      width: 100%;
      background: var(--bg-alt);
      border: 1px solid var(--rule);
      color: var(--cream);
      font-family: "Geist", sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 14px;
      outline: none;
      border-radius: 0;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(177, 209, 96, .1);
    }

    .login-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-family: "Geist Mono", monospace;
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--cream-soft);
      margin-bottom: 0;
    }

    .remember-label input {
      width: 14px;
      height: 14px;
      accent-color: var(--green);
    }

    .btn-login {
      width: 100%;
      background: var(--green);
      color: var(--bg);
      border: none;
      padding: 14px;
      font-family: "Geist Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn-login:hover {
      opacity: .85;
    }

    .login-error {
      background: rgba(217, 106, 61, .08);
      border: 1px solid var(--rust);
      border-left: 3px solid var(--rust);
      color: var(--rust);
      padding: 12px 16px;
      font-family: "Geist Mono", monospace;
      font-size: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .login-title {
        font-size: 48px;
      }

      .login-banner {
        left: 20px;
        right: 20px;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
      }

      .login-brand {
        left: 20px;
      }
    }
  </style>
</head>

<body>

  <img src="{% static 'growlog/logo.png' %}" alt="" class="login-watermark" aria-hidden="true">

  <div class="login-brand">
    <img src="{% static 'growlog/logo.png' %}" alt="62xroots">
    <div>
      <div class="login-brand__name">62×ROOTS</div>
      <div class="login-brand__sub">grower's terminal · v0.3</div>
    </div>
  </div>

  <div class="login-card">
    <div class="login-eyebrow">// login · authenticated session</div>
    <h1 class="login-title">BIENVENIDO</h1>
    <span class="login-title login-title--accent">log de cultivo</span>
    <p class="login-subtitle">Ingresá para acceder a tus cultivos.</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="login-fields">
      {% csrf_token %}
      <div>
        <label for="username">usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus>
      </div>
      <div>
        <label for="password">contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <div class="login-meta">
        <label class="remember-label">
          <input type="checkbox" name="remember">
          recordar sesión
        </label>
      </div>
      <button type="submit" class="btn-login">ingresar →</button>
    </form>
  </div>

  <div class="login-banner">
    <span>// grower's terminal · v0.3</span>
    <span> alansaja13/62xroots ●</span>
  </div>

</body>

</html>
