<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — 62xroots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --c-bg: #050507; --c-s1: #0a0a10; --c-border: #1c1c2c; --c-border2: #262638;
      --c-green: #ACDE1D; --c-text: #c8c8dc; --c-muted: #44445e; --c-danger: #ff4d6d;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: var(--c-bg);
      background-image: radial-gradient(rgba(60,60,120,.035) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--c-text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-wrap { width: 100%; max-width: 360px; padding: 1rem; }

    .login-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-brand__num {
      font-size: 4rem;
      font-weight: 900;
      line-height: 1;
      font-family: ui-monospace, monospace;
      color: var(--c-green);
      opacity: .18;
      display: block;
      letter-spacing: -.04em;
    }
    .login-brand__name {
      font-size: 1.2rem;
      font-weight: 900;
      font-family: ui-monospace, monospace;
      color: var(--c-green);
      display: block;
      margin-top: -.5rem;
    }
    .login-brand__bracket { color: var(--c-muted); font-weight: 300; }
    .login-brand__x { color: var(--c-muted); font-weight: 400; font-size: .88em; }

    .login-box {
      background: var(--c-s1);
      border: 1px solid var(--c-border);
      border-top: 3px solid var(--c-green);
      border-radius: 6px;
      padding: 1.75rem;
    }
    .login-box__title {
      font-size: .58rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--c-muted);
      font-family: ui-monospace, monospace;
      margin-bottom: 1.25rem;
    }

    label {
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--c-muted);
      display: block;
      margin-bottom: .35rem;
    }
    input[type=text], input[type=password] {
      width: 100%;
      background: #060610;
      border: 1px solid var(--c-border2);
      border-radius: 4px;
      color: var(--c-text);
      padding: .55rem .75rem;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s;
      font-family: ui-monospace, monospace;
    }
    input[type=text]:focus, input[type=password]:focus {
      border-color: var(--c-green);
    }
    .field { margin-bottom: 1rem; }

    .btn-login {
      width: 100%;
      background: var(--c-green);
      color: #020a06;
      font-weight: 800;
      font-size: .8rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      padding: .65rem;
      cursor: pointer;
      margin-top: .5rem;
      transition: opacity .15s;
    }
    .btn-login:hover { opacity: .85; }

    .login-error {
      background: rgba(255,77,109,.1);
      border: 1px solid rgba(255,77,109,.25);
      color: var(--c-danger);
      border-radius: 4px;
      padding: .55rem .75rem;
      font-size: .8rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <span class="login-brand__num">62</span>
      <span class="login-brand__name">
        <span class="login-brand__bracket">‹</span>62<span class="login-brand__x">xroots</span><span class="login-brand__bracket">›</span>
      </span>
    </div>

    <div class="login-box">
      <div class="login-box__title">◈ acceso</div>
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
