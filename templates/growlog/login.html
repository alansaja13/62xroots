{% load static %}
<!doctype html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso — 62xroots</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=JetBrains+Mono:wght@300..700&display=swap"
    rel="stylesheet">

  <style>
    /* ═══ VERDE · LOGIN TOKENS ═══════════════════════════════ */
    :root {
      --bg: #0e120c;
      --bg-alt: #161a12;
      --card: #1c2218;
      --card-alt: #232a1f;
      --rule: #2a3023;
      --rule-soft: #1a201a;
      --cream: #ece2c8;
      --cream-soft: #94a586;
      --fine: #525e48;
      --green: #8aab68;
      --green-deep: #4a5f30;
      --green-wash: rgba(138, 171, 104, .10);
      --rust: #c46a3e;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background:
        radial-gradient(circle at 0% 0%, rgba(138, 171, 104, .05) 0, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(196, 106, 62, .035) 0, transparent 35%),
        var(--bg);
      color: var(--cream);
      font-family: "Manrope", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Decoración botánica de línea (en vez de logo watermark crudo) */
    .login-sprig {
      position: absolute;
      right: -80px;
      top: 50%;
      transform: translateY(-50%);
      width: 560px;
      height: 560px;
      opacity: .12;
      pointer-events: none;
      color: var(--green);
    }

    .login-watermark {
      position: absolute;
      right: -120px;
      top: -80px;
      width: 620px;
      height: 620px;
      opacity: .05;
      pointer-events: none;
    }

    .login-brand {
      position: absolute;
      top: 28px;
      left: 40px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .login-brand img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      filter: drop-shadow(0 0 8px rgba(138, 171, 104, .45));
    }

    .login-brand__name {
      font-family: "Manrope", sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--cream);
      line-height: 1;
      letter-spacing: -.02em;
    }

    .login-brand__sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--fine);
      display: block;
      margin-top: 4px;
    }

    .login-banner {
      position: absolute;
      bottom: 24px;
      left: 40px;
      right: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--fine);
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    .login-eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--fine);
      margin-bottom: 8px;
    }

    .login-title {
      font-family: "Manrope", sans-serif;
      font-size: 68px;
      font-weight: 800;
      letter-spacing: -.04em;
      line-height: .92;
      display: block;
      margin: 0;
      color: var(--cream);
    }

    .login-title--accent {
      color: var(--green);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -.02em;
    }

    .login-subtitle {
      font-family: "Manrope", sans-serif;
      font-size: 14px;
      color: var(--cream-soft);
      margin-top: 18px;
      line-height: 1.5;
    }

    .login-fields {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    label {
      font-family: "Manrope", sans-serif;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--fine);
      font-weight: 700;
      display: block;
      margin-bottom: 8px;
    }

    input[type=text],
    input[type=password] {
      width: 100%;
      background: var(--bg-alt);
      border: 1px solid var(--rule);
      color: var(--cream);
      font-family: "Manrope", sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 12px 14px;
      outline: none;
      border-radius: 10px;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(138, 171, 104, .14);
    }

    .login-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-family: "Manrope", sans-serif;
      font-size: 12px;
      letter-spacing: .02em;
      text-transform: none;
      color: var(--cream-soft);
      font-weight: 500;
      margin-bottom: 0;
    }

    .remember-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--green);
    }

    .btn-login {
      width: 100%;
      background: var(--rust);
      color: var(--bg);
      border: none;
      padding: 15px;
      border-radius: 999px;
      font-family: "Manrope", sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .02em;
      cursor: pointer;
      transition: opacity .15s, transform .12s;
      box-shadow: 0 8px 22px rgba(196, 106, 62, .3);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      opacity: .94;
      transform: translateY(-1px);
    }

    .login-error {
      background: rgba(196, 106, 62, .08);
      border: 1px solid rgba(196, 106, 62, .5);
      border-left: 3px solid var(--rust);
      color: var(--rust);
      padding: 12px 16px;
      border-radius: 12px;
      font-family: "Manrope", sans-serif;
      font-size: 13px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .login-title {
        font-size: 48px;
      }

      .login-sprig {
        width: 360px;
        height: 360px;
        right: -120px;
      }

      .login-banner {
        left: 20px;
        right: 20px;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
      }

      .login-brand {
        left: 20px;
      }
    }
  </style>
</head>

<body>

  <img src="{% static 'growlog/logo.png' %}" alt="" class="login-watermark" aria-hidden="true">

  <svg class="login-sprig" viewBox="0 0 200 200" fill="none" aria-hidden="true">
    <path d="M30 170 Q60 140 90 110 Q120 80 160 40" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M70 130 Q60 115 50 110" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M70 130 Q80 115 90 110" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M100 100 Q88 88 78 85" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M100 100 Q112 88 122 85" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M130 70 Q118 60 108 58" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M130 70 Q142 60 152 58" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </svg>

  <div class="login-brand">
    <img src="{% static 'growlog/logo.png' %}" alt="62xroots">
    <div>
      <div class="login-brand__name">62×ROOTS</div>
      <div class="login-brand__sub">grower's terminal · v0.3</div>
    </div>
  </div>

  <div class="login-card">
    <div class="login-eyebrow">// login · authenticated session</div>
    <h1 class="login-title">BIENVENIDO</h1>
    <span class="login-title login-title--accent">log de cultivo</span>
    <p class="login-subtitle">Ingresá para acceder a tus cultivos.</p>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" class="login-fields">
      {% csrf_token %}
      <div>
        <label for="username">usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus>
      </div>
      <div>
        <label for="password">contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <div class="login-meta">
        <label class="remember-label">
          <input type="checkbox" name="remember">
          recordar sesión
        </label>
      </div>
      <button type="submit" class="btn-login">ingresar →</button>
    </form>
  </div>

  <div class="login-banner">
    <span>// grower's terminal · v0.3</span>
    <span> alansaja13/62xroots ●</span>
  </div>

</body>

</html>
