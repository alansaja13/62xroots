{% extends "base.html" %}
{% block title %}400 — Solicitud inválida{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
  <div style="text-align: center; max-width: 520px;">
    <div class="mono" style="font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--fine); margin-bottom: 18px;">
      // error · 400
    </div>
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-variation-settings: 'wdth' 85, 'opsz' 96;
                font-size: 160px; font-weight: 800; line-height: .85; letter-spacing: -.03em;
                color: var(--honey); opacity: .18; user-select: none; margin-bottom: -20px;">
      400
    </div>
    <h1 style="font-family: 'Bricolage Grotesque', sans-serif; font-variation-settings: 'wdth' 85, 'opsz' 96;
               font-size: 36px; font-weight: 800; color: var(--cream); margin-bottom: 12px; letter-spacing: -.02em;">
      Solicitud inválida
    </h1>
    <p style="font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--cream-soft);
              line-height: 1.6; margin-bottom: 32px; letter-spacing: .03em;">
      La solicitud no pudo ser procesada.<br>
      Esto puede pasar si el formulario expiró — intentá de nuevo.
    </p>
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="/" class="btn-brand">
        <i class="bi bi-house-fill"></i> volver al inicio
      </a>
      <button onclick="history.back()" class="btn-ghost">
        <i class="bi bi-chevron-left"></i> atrás
      </button>
    </div>
  </div>
</div>
{% endblock %}
